<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">CardForge Home Desk current visual intent</title><desc id="desc">Spatial Home Desk with four-surface navigation, authored Sets and Projects arranged as physical working objects, selected Set expansion, and immediate object actions for Open, Edit or Test, Generate, Export, Duplicate, Save, and Send to Pipeline.</desc><rect width="1600" height="900" fill="#0b0c0d"/><rect x="24" y="24" width="1552" height="852" rx="28" fill="#111214" stroke="#4a3a22" stroke-width="3"/><text x="72" y="86" fill="#d6aa57" font-size="34" font-family="Georgia,serif">CARDFORGE</text><g fill="#9e9b94" font-size="18" font-family="Arial,sans-serif"><text x="610" y="82" fill="#d6aa57">Home</text><text x="720" y="82">Library</text><text x="830" y="82">Studio</text><text x="930" y="82">Profile</text></g><text x="72" y="150" fill="#f3efe5" font-size="42" font-family="Georgia,serif">Welcome back. Pick up where you left off.</text><rect x="230" y="200" width="690" height="430" rx="26" fill="#1b1814" stroke="#b08d45" stroke-width="4" transform="rotate(-2 575 415)"/><text x="285" y="290" fill="#e6c789" font-size="42" font-family="Georgia,serif">CLASH OF FISTS</text><rect x="300" y="330" width="150" height="210" rx="12" fill="#32241c" stroke="#b08d45"/><rect x="470" y="320" width="150" height="220" rx="12" fill="#39261e" stroke="#b08d45"/><rect x="640" y="340" width="150" height="200" rx="12" fill="#261f1a" stroke="#b08d45"/><g fill="#c8a15d" font-size="18" font-family="Arial,sans-serif"><text x="300" y="585">In Pipeline · r3</text><text x="300" y="612" fill="#aaa59b">120 cards · updated recently</text></g><rect x="1020" y="200" width="420" height="250" rx="22" fill="#171512" stroke="#3f372d"/><text x="1060" y="280" fill="#e8dfce" font-size="36" font-family="Georgia,serif">TYPE IN MOTION</text><text x="1060" y="330" fill="#c89c4c" font-size="18" font-family="Arial,sans-serif">Needs changes</text><rect x="120" y="520" width="380" height="220" rx="22" fill="#171512" stroke="#3f372d"/><text x="160" y="590" fill="#f1eadb" font-size="28" font-family="Georgia,serif">Northpoint Summit</text><text x="160" y="625" fill="#72b978" font-size="17" font-family="Arial,sans-serif">Published · r2</text><rect x="810" y="560" width="410" height="180" rx="22" fill="#161513" stroke="#3f372d"/><text x="850" y="625" fill="#f1eadb" font-size="30" font-family="Georgia,serif">Typography Experiment</text><text x="850" y="662" fill="#cf675e" font-size="17" font-family="Arial,sans-serif">Needs changes</text><rect x="260" y="780" width="1080" height="70" rx="18" fill="#1a1a19" stroke="#4c4237"/><g fill="#d8c7a4" font-size="18" font-family="Arial,sans-serif" text-anchor="middle"><text x="350" y="823">Open</text><text x="510" y="823">Edit / Test</text><text x="675" y="823">Generate</text><text x="830" y="823">Export</text><text x="980" y="823">Duplicate</text><text x="1110" y="823">Save</text><text x="1250" y="823">Send to Pipeline</text></g></svg>