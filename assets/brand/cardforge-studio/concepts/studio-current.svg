<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">CardForge Studio current visual intent</title><desc id="desc">Single spatial Set Desk with selected artifact centered, compact Set navigation, contextual inspector, exact Pipeline revision state, and Generate, Export, Save, Vote, Compare, and Send to Pipeline as tools rather than separate pages.</desc><rect width="1600" height="900" fill="#090a0b"/><rect x="24" y="24" width="1552" height="852" rx="28" fill="#111214" stroke="#41372b" stroke-width="3"/><text x="72" y="82" fill="#d6aa57" font-size="34" font-family="Georgia,serif">CARDFORGE</text><g fill="#98958f" font-size="18" font-family="Arial,sans-serif"><text x="550" y="82">Home</text><text x="655" y="82">Library</text><text x="770" y="82" fill="#d6aa57">Studio</text><text x="875" y="82">Profile</text></g><rect x="56" y="122" width="260" height="680" rx="16" fill="#151617" stroke="#39352f"/><text x="82" y="164" fill="#d7c6a7" font-size="18" font-family="Arial,sans-serif">ACTIVE SET</text><text x="82" y="204" fill="#f0eadc" font-size="27" font-family="Georgia,serif">Clash of Fists</text><g font-family="Arial,sans-serif" font-size="18" fill="#aaa59b"><text x="82" y="258">Overview</text><text x="82" y="300" fill="#e3bd75">Cards</text><text x="82" y="342">Templates</text><text x="82" y="384">Assets</text><text x="82" y="426">Rules</text><text x="82" y="468">Playtest</text></g><rect x="340" y="122" width="880" height="680" rx="16" fill="#181510" stroke="#4b4034"/><text x="380" y="168" fill="#aaa59b" font-size="18" font-family="Arial,sans-serif">Cards / Hero / Brakk, Ironbound</text><rect x="505" y="215" width="450" height="520" rx="24" fill="#261d16" stroke="#b08d45" stroke-width="4"/><rect x="555" y="270" width="350" height="230" rx="16" fill="#3a2a21"/><text x="585" y="325" fill="#d6aa57" font-size="24" font-family="Georgia,serif">BRAKK, IRONBOUND</text><text x="610" y="555" fill="#f0eadc" font-size="20" font-family="Georgia,serif">Relentless — gains power and armor.</text><text x="380" y="760" fill="#aaa59b" font-size="16" font-family="Arial,sans-serif">Set objects remain visible while focused tools open around them.</text><rect x="1240" y="122" width="300" height="680" rx="16" fill="#151617" stroke="#39352f"/><text x="1270" y="168" fill="#f0eadc" font-size="26" font-family="Georgia,serif">Inspector</text><text x="1270" y="215" fill="#c89c4c" font-size="18" font-family="Arial,sans-serif">Candidate r3 · In review</text><text x="1270" y="275" fill="#aaa59b" font-size="16" font-family="Arial,sans-serif">Published r2</text><text x="1270" y="310" fill="#d6aa57" font-size="16" font-family="Arial,sans-serif">Candidate r3</text><rect x="1270" y="340" width="230" height="48" rx="10" fill="#1b1b1a" stroke="#4e4337"/><text x="1330" y="371" fill="#dfc58f" font-size="17" font-family="Arial,sans-serif">Compare r2 ↔ r3</text><text x="1270" y="435" fill="#aaa59b" font-size="15" font-family="Arial,sans-serif">Vote on current</text><text x="1270" y="474" fill="#79bc7e" font-size="21" font-family="Arial,sans-serif">👍 14</text><text x="1385" y="474" fill="#d96b61" font-size="21" font-family="Arial,sans-serif">👎 2</text><rect x="350" y="820" width="1160" height="56" rx="14" fill="#171817" stroke="#4c4237"/><g fill="#e1c98e" font-size="18" font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="855">Generate</text><text x="700" y="855">Export</text><text x="920" y="855">Save · Google Drive</text><text x="1200" y="855">Send to Pipeline</text><text x="1410" y="855">Vote</text></g></svg>