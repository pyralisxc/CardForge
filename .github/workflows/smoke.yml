name: Public smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify lean public contract
        run: npm run smoke
        env:
          CARDFORGE_ACCESS_MODE: free
          NEXT_PUBLIC_CARDFORGE_ACCESS_MODE: free
          CARDFORGE_E2E_ALLOW_DISPOSABLE_USERS: "false"
