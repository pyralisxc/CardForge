name: Public smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify free export gate
        run: npx playwright test tests/smoke/card-forge.spec.ts --workers=1 --grep "lets free users try clean export"
        env:
          CARDFORGE_ACCESS_MODE: free
          NEXT_PUBLIC_CARDFORGE_ACCESS_MODE: free
          CARDFORGE_E2E_ALLOW_DISPOSABLE_USERS: "false"
      - name: Verify remaining public flows
        run: npm run smoke -- --grep-invert "lets free users try clean export"
        env:
          CARDFORGE_E2E_ALLOW_DISPOSABLE_USERS: "false"
