name: Apply canonical render MCP refactor

on:
  push:
    branches: [feature/canonical-render-artifacts]
    paths: [scripts/apply-canonical-render-mcp-refactor.mjs]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-render-artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-canonical-render-mcp-refactor.mjs
      - name: Commit refactor
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/studio-documents/server
          git commit -m "Use native canonical render artifacts in MCP previews"
          git push origin HEAD:feature/canonical-render-artifacts
