name: Development Intelligence seal final candidate

on:
  push:
    branches:
      - refactor/shared-contextual-tool-lifecycle

permissions:
  contents: write

concurrency:
  group: development-intelligence-seal-final-candidate
  cancel-in-progress: true

jobs:
  seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Remove one-shot workflow before analysis
        run: git rm .github/workflows/development-intelligence-seal-final-candidate.yml
      - name: Seal exact final-tree Development Intelligence checkpoint
        uses: pyralisxc/Development-Intelligence@bc093fc6c1ea5bf316f6710c91fc9c85d9cb0cd6 # v2.3.0
        with:
          project: pyralisxc/CardForge
          mode: seal
      - name: Verify exact final-tree checkpoint
        uses: pyralisxc/Development-Intelligence@bc093fc6c1ea5bf316f6710c91fc9c85d9cb0cd6 # v2.3.0
        with:
          project: pyralisxc/CardForge
          mode: check
      - name: Commit sealed checkpoint
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .development-intelligence
          git commit -m "chore: seal final Development Intelligence checkpoint"
          git push origin HEAD:"${GITHUB_REF_NAME}"
