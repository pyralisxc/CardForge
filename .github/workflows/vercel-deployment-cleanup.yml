name: Vercel Deployment Cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview eligible deployments or delete them
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - delete
      confirm_project:
        description: Type card-forge to enable delete mode
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-deployment-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Require Vercel token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Repository secret VERCEL_TOKEN is required." >&2
            exit 1
          fi

      - name: Dry-run cleanup
        if: inputs.mode == 'dry-run'
        run: node scripts/cleanup-vercel-deployments.mjs

      - name: Validate delete confirmation
        if: inputs.mode == 'delete'
        env:
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        shell: bash
        run: |
          if [ "$CONFIRM_PROJECT" != "card-forge" ]; then
            echo "Delete mode requires confirm_project to equal card-forge exactly." >&2
            exit 1
          fi

      - name: Delete eligible deployments
        if: inputs.mode == 'delete'
        run: node scripts/cleanup-vercel-deployments.mjs --execute --confirm=card-forge
