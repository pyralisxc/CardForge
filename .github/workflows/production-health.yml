name: Production health

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install health-check dependencies
        run: node scripts/run-ci-check.mjs --title "Health dependency install" -- npm ci --ignore-scripts
      - name: Run production health
        run: node scripts/run-ci-check.mjs --title "Production health" -- npm run health:production
