name: Production health

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install health-check dependencies
        # Full CI retains npm audit; scheduled health measures the deployed product/providers.
        run: node scripts/run-ci-check.mjs --title "Health dependency install" -- npm ci --workspace @cardforge/hosted-verification --include-workspace-root=false --ignore-scripts --no-audit --no-fund
      - name: Run production health
        run: node scripts/run-ci-check.mjs --title "Production health" -- npm run health:production
