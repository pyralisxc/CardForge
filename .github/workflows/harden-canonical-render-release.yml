name: Harden canonical render release

on:
  push:
    branches: [feature/canonical-render-artifacts]
    paths:
      - scripts/harden-canonical-render-release.mjs

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-render-artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/harden-canonical-render-release.mjs
      - name: Commit hardened release contract
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src plugins supabase
          git commit -m "Harden canonical render MCP workflow"
          git push origin HEAD:feature/canonical-render-artifacts
