name: CardForge Studio plugin package

on:
  workflow_dispatch:
  push:
    branches: [vercel-preview, main]
    paths:
      - 'plugins/cardforge-studio/**'
      - 'plugins/cardforge-owner/**'
      - 'scripts/package-cardforge-plugin.mjs'
      - 'scripts/package-cardforge-preview-plugins.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/plugin-package.yml'

permissions:
  contents: read

concurrency:
  group: cardforge-studio-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install package dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build standalone plugin ZIP
        run: npm run plugin:package
      - name: Upload CardForge Studio plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cardforge-studio-plugin
          path: dist/plugins/cardforge-studio-*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build private Preview plugin variants
        if: github.ref == 'refs/heads/vercel-preview'
        run: npm run plugin:package:preview
      - name: Upload private Preview preparation artifacts
        if: github.ref == 'refs/heads/vercel-preview'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cardforge-private-preview-plugins
          path: dist/plugins/cardforge-*-preview-*.zip
          if-no-files-found: error
          retention-days: 30
