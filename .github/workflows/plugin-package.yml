name: CardForge Studio plugin package

on:
  workflow_dispatch:
  push:
    branches: [vercel-preview, main]
    paths:
      - 'plugins/cardforge-studio/**'
      - 'scripts/package-cardforge-plugin.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/plugin-package.yml'

permissions:
  contents: read

concurrency:
  group: cardforge-studio-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install package dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build standalone plugin ZIP
        run: npm run plugin:package
      - name: Upload CardForge Studio plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cardforge-studio-plugin
          path: dist/plugins/cardforge-studio-*.zip
          if-no-files-found: error
          retention-days: 30
