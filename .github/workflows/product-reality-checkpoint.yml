name: Product Reality Checkpoint

on:
  push:
    branches: [vercel-preview, main]

permissions:
  contents: read

env:
  CARDFORGE_REALITY_BASE: ${{ github.ref_name == 'main' && github.event.before || 'origin/main' }}
  CARDFORGE_REQUIRE_SEALED_REALITY: '1'

concurrency:
  group: product-reality-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  seal-preview:
    if: github.ref_name == 'vercel-preview'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.seal.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install sealing dependencies
        run: node scripts/run-ci-check.mjs --title "Checkpoint seal dependency install" -- npm ci --ignore-scripts --no-audit --no-fund
      - id: seal
        name: Seal exact Preview Product Reality candidate
        run: |
          npm run product-reality:seal
          if ! git diff --quiet -- docs/generated/product-reality.ndjson docs/product-surface-map.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/generated/product-reality.ndjson docs/product-surface-map.md
            git commit -m "Seal Product Reality candidate"
            git push origin HEAD:vercel-preview
          fi
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checkpoint:
    needs: seal-preview
    if: >-
      always() &&
      (github.ref_name == 'main' || needs.seal-preview.result == 'success')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name == 'vercel-preview' && 'vercel-preview' || github.sha }}
          fetch-depth: 2
      - if: github.ref_name == 'vercel-preview'
        run: git fetch origin main --depth=1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: node scripts/run-ci-check.mjs --title "Checkpoint dependency install" -- npm ci
      - id: candidate
        name: Resolve exact candidate SHA
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify sealed Product Reality checkpoint
        run: npm run product-reality:check
      - name: Render A to B heat map
        run: |
          npm run product-reality:diff -- --base "$CARDFORGE_REALITY_BASE" | tee product-reality-checkpoint.md
          cat product-reality-checkpoint.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain checkpoint heat map
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-reality-${{ github.ref_name }}-${{ steps.candidate.outputs.sha }}
          path: product-reality-checkpoint.md
          if-no-files-found: error
          retention-days: 14
