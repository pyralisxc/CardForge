name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARDFORGE_VERIFY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Development Intelligence analysis
        uses: pyralisxc/Development-Intelligence@76615549ddd17be93b3690dc6ae3a20869285581 # checkpointless analysis
        with:
          project: pyralisxc/CardForge
          mode: analyze

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history keeps CARDFORGE_VERIFY_BASE resolvable for long-lived
          # Preview branches and forward-only migration checks.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: node scripts/run-ci-check.mjs --title "Dependency install" -- npm ci
      - name: Run full repository gate
        run: node scripts/run-ci-check.mjs --title "Full repository gate" -- npm run verify:full

  browser-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Route specialized verification
        id: route
        run: node scripts/report-affected-verification.mjs --base "$CARDFORGE_VERIFY_BASE" --github-output
      - if: steps.route.outputs.browser_golden != 'true'
        run: echo "No browser-owned surface changed; browser setup and tests were skipped." >> "$GITHUB_STEP_SUMMARY"
      - if: steps.route.outputs.browser_golden == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: steps.route.outputs.browser_golden == 'true'
        name: Install dependencies
        run: node scripts/run-ci-check.mjs --title "Browser dependency install" -- npm ci
      - if: steps.route.outputs.browser_golden == 'true'
        name: Install Chromium
        run: node scripts/run-ci-check.mjs --title "Chromium install" -- npx playwright install --with-deps chromium
      - if: steps.route.outputs.browser_golden == 'true'
        name: Run compact browser gate
        run: node scripts/run-ci-check.mjs --title "Golden browser gate" -- npm run smoke:golden
      - if: ${{ !cancelled() && steps.route.outputs.browser_golden == 'true' }}
        name: Retain browser review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-browser-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  native-catalog-trash:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Route native database verification
        id: native
        shell: bash
        run: |
          if git diff --name-only "$CARDFORGE_VERIFY_BASE" HEAD | grep -Eq '^(supabase/(migrations|tests)/|scripts/(verify-catalog-trash-local.sh|test-catalog-trash-contention.py|backfill-local-pipeline-media.mjs|sync-pipeline-defaults.mjs)|.github/workflows/ci.yml)'; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.native.outputs.required == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: steps.native.outputs.required == 'true'
        name: Install canonical importer dependencies
        run: npm ci
      - if: steps.native.outputs.required == 'true'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # official v1.7.3
        with:
          version: 2.122.0
      - if: steps.native.outputs.required == 'true' && github.head_ref == 'work/pipeline-lifecycle-parity-20261031'
        name: Prepare canonical revision recovery migration
        shell: bash
        run: |
          set -euo pipefail
          [[ ${GITHUB_ACTIONS:-} == true && ${RUNNER_ENVIRONMENT:-} == github-hosted ]]
          [[ ${GITHUB_HEAD_REF:-} == work/pipeline-lifecycle-parity-20261031 ]]
          [[ -z ${SUPABASE_ACCESS_TOKEN:-} && -z ${SUPABASE_DB_PASSWORD:-} && -z ${DOCKER_HOST:-} ]]
          [[ $(supabase --version) == 2.122.0 ]]
          mkdir -p test-results/revision-recovery-preparation
          supabase migration --help > test-results/revision-recovery-preparation/migration-help.txt
          supabase migration new --help > test-results/revision-recovery-preparation/new-help.txt
          supabase migration new pipeline_revision_recovery
          mapfile -t generated < <(git ls-files --others --exclude-standard 'supabase/migrations/*_pipeline_revision_recovery.sql')
          [[ ${#generated[@]} == 1 ]]
          [[ ${generated[0]} =~ ^supabase/migrations/[0-9]{14}_pipeline_revision_recovery.sql$ ]]
          cp "${generated[0]}" test-results/revision-recovery-preparation/
          sha256sum "${generated[0]}" > test-results/revision-recovery-preparation/generated-sha256.txt
          git rev-parse HEAD HEAD^{tree} > test-results/revision-recovery-preparation/source-identity.txt
      - if: steps.native.outputs.required == 'true' && github.head_ref == 'work/pipeline-lifecycle-parity-20261031'
        name: Retain canonical revision recovery migration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: revision-recovery-migration-preparation
          path: test-results/revision-recovery-preparation/
          if-no-files-found: error
          retention-days: 7
      - if: steps.native.outputs.required == 'true'
        name: Replay native Supabase migrations and SQL contention fixtures
        run: bash scripts/verify-catalog-trash-local.sh
      - if: ${{ always() && steps.native.outputs.required == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-catalog-trash-proof
          path: test-results/native-catalog-trash/
          if-no-files-found: warn
          retention-days: 7
