name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARDFORGE_VERIFY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: node scripts/run-ci-check.mjs --title "Dependency install" -- npm ci
      - name: Report Product Reality delta
        run: npm run product-reality:diff -- --base "$CARDFORGE_VERIFY_BASE" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate Product Reality outputs
        run: npm run product-reality:generate
      - name: Verify committed Product Reality freshness
        run: |
          if git ls-files --error-unmatch docs/generated/product-reality.json >/dev/null 2>&1; then
            git diff --exit-code -- docs/generated/product-reality.json docs/product-surface-map.md
          else
            echo "Product Reality baseline is being bootstrapped; freshness enforcement begins once the generated graph is tracked." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run full repository gate
        run: node scripts/run-ci-check.mjs --title "Full repository gate" -- npm run verify:full
      - name: Retain Product Reality artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-reality-bootstrap
          path: |
            docs/generated/product-reality.json
            docs/product-surface-map.md
          if-no-files-found: error
          retention-days: 3

  browser-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Route specialized verification
        id: route
        run: node scripts/report-affected-verification.mjs --base "$CARDFORGE_VERIFY_BASE" --github-output
      - if: steps.route.outputs.browser_golden != 'true'
        run: echo "No browser-owned surface changed; browser setup and tests were skipped." >> "$GITHUB_STEP_SUMMARY"
      - if: steps.route.outputs.browser_golden == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: steps.route.outputs.browser_golden == 'true'
        name: Install dependencies
        run: node scripts/run-ci-check.mjs --title "Browser dependency install" -- npm ci
      - if: steps.route.outputs.browser_golden == 'true'
        name: Install Chromium
        run: node scripts/run-ci-check.mjs --title "Chromium install" -- npx playwright install --with-deps chromium
      - if: steps.route.outputs.browser_golden == 'true'
        name: Run compact browser gate
        run: node scripts/run-ci-check.mjs --title "Golden browser gate" -- npm run smoke:golden
      - if: ${{ !cancelled() && steps.route.outputs.browser_golden == 'true' }}
        name: Retain browser review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-browser-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
