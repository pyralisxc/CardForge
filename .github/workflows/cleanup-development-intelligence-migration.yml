name: cleanup-development-intelligence-migration

on:
  push:
    branches: [feat/development-intelligence-semantic-migration]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/development-intelligence-semantic-migration
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Replace retired Product Reality living-doc reference
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'docs/product-direction.md';
          const before = 'Status: living product direction. This document records the intended product model and next delivery sequence. It does not describe shipped behavior. [architecture.md](architecture.md) remains authoritative for shipped ownership and invariants, while generated [product-surface-map.md](product-surface-map.md) is the compact current-state Product Reality projection and the live `/roadmap` owns publicly presented capability status and votes.';
          const after = 'Status: living product direction. This document records the intended product model and next delivery sequence. It does not describe shipped behavior. [architecture.md](architecture.md) remains authoritative for shipped ownership and invariants; current observed technical/product topology comes from source and may be inspected through Development Intelligence when available; the live `/roadmap` owns publicly presented capability status and votes.';
          const source = fs.readFileSync(file, 'utf8');
          const count = source.split(before).length - 1;
          if (count !== 1) throw new Error(`Expected exactly one retired Product Reality status reference, found ${count}`);
          fs.writeFileSync(file, source.replace(before, after));
          NODE
      - name: Commit exact doc cleanup and remove one-shot workflow
        run: |
          rm .github/workflows/cleanup-development-intelligence-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product-direction.md .github/workflows/cleanup-development-intelligence-migration.yml
          git commit -m "docs: retire Product Reality status reference"
          git push origin HEAD:feat/development-intelligence-semantic-migration
