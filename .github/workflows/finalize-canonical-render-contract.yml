name: Finalize canonical render contract

on:
  push:
    branches: [feature/canonical-render-artifacts]
    paths:
      - scripts/finalize-canonical-render-contract.mjs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-render-artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/finalize-canonical-render-contract.mjs
      - name: Commit generated contract updates
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src plugins tests docs
          git commit -m "Align plugin contract with canonical render artifacts"
          git push origin HEAD:feature/canonical-render-artifacts
