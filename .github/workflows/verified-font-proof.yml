name: Reviewed Font Source Proof

on:
  pull_request:
    paths:
      - 'data/pipeline-bootstrap/fonts/**'
      - 'scripts/lib/verifiedFontSources.mjs'
      - 'scripts/sync-pipeline-defaults.mjs'
      - 'src/domain/rendering/fonts.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium for source-verified card-size specimens
        run: npx playwright install --with-deps chromium
      - name: Verify license, original source, axes, glyphs and render card-size samples
        run: node scripts/sync-pipeline-defaults.mjs --verify-reviewed-fonts --specimens
      - name: Verify local bundled-family provenance regressions
        run: npx vitest run tests/product/unit/bundled-font-provenance.test.ts tests/product/unit/verified-font-candidates.test.ts
      - if: ${{ !cancelled() }}
        name: Retain image-only font review specimen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-fonts-card-size-specimen
          path: artifacts/font-review/*.png
          if-no-files-found: warn
          retention-days: 14
