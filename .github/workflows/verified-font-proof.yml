name: Reviewed Font Source Proof

on:
  pull_request:
    paths:
      - 'data/pipeline-bootstrap/fonts/**'
      - 'scripts/lib/verifiedFontSources.mjs'
      - 'scripts/sync-pipeline-defaults.mjs'
      - 'src/domain/rendering/fonts.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify original copyright, immutable bytes, variation axes, and glyphs
        run: node scripts/sync-pipeline-defaults.mjs --verify-reviewed-fonts
      - name: Verify local bundled-family provenance regressions
        run: npx vitest run tests/product/unit/bundled-font-provenance.test.ts tests/product/unit/verified-font-candidates.test.ts
