name: Deployment smoke

on:
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      environment:
        description: Vercel environment to verify
        required: true
        type: choice
        options: [preview, production]
      deployment_url:
        description: Exact Vercel deployment URL
        required: true
        type: string
      git_sha:
        description: Exact deployed commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deployment-smoke-${{ github.event.client_payload.environment || inputs.environment }}-${{ github.event.client_payload.git.ref || inputs.git_sha }}
  cancel-in-progress: true

jobs:
  preview-smoke:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'preview') ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.project.name == 'card-forge' && github.event.client_payload.environment == 'preview' && github.event.client_payload.git.ref == 'vercel-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARDFORGE_E2E_BASE_URL: ${{ github.event.client_payload.url || inputs.deployment_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.git.sha || inputs.git_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: node scripts/run-ci-check.mjs --title "Preview dependency install" -- npm ci
      - name: Install Chromium
        run: node scripts/run-ci-check.mjs --title "Preview Chromium install" -- npx playwright install --with-deps chromium
      - name: Run Preview smoke
        run: node scripts/run-ci-check.mjs --title "Vercel Preview smoke" -- npm run smoke:hosted
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  production-smoke:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.project.name == 'card-forge' && github.event.client_payload.environment == 'production' && github.event.client_payload.git.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CARDFORGE_HEALTH_ORIGIN: ${{ github.event_name == 'repository_dispatch' && 'https://cardforges.com' || inputs.deployment_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.git.sha || inputs.git_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run immediate production route smoke
        run: node scripts/run-ci-check.mjs --title "Post-deploy production smoke" -- node scripts/check-production-health.mjs --category=route
